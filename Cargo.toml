[package]
name = "cargo-bin-health"
version = "0.1.0"
edition = "2024"
description = "Inspect Rust binaries and firmware for memory, dependency, and build health"
license = "MIT OR Apache-2.0"
authors = ["Jorge Andre Castro <jorgeandrecastro>"]
repository = "https://github.com/jorgeandrecastro/cargo-bin-health"
readme = "README.md"
keywords = ["embedded", "elf", "firmware", "memory", "cargo"]
categories = ["development-tools", "embedded"]

[[bin]]
name = "cargo-bin-health"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
goblin = "0.10"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
